name: metrickle
description: >-
  Accessibility-first UX research and conversion analytics for Flutter: screens, events,
  friction signals, in-app surveys and feedback, segmented by assistive-technology use.
version: 0.1.0
homepage: https://metrickle.com
repository: https://github.com/metrickle/metrickle-flutter
issue_tracker: https://github.com/metrickle/metrickle-flutter/issues
topics:
  - analytics
  - accessibility
  - surveys
  - ux

environment:
  sdk: ^3.8.0
  flutter: ">=3.35.0"

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
